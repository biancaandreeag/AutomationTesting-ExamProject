name: Automation tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suita de teste'
        required: true
        default: smokeSuite
        type: choice
        options:
          - smokeSuite
          - regressionSuite
          - apiSuite
          - allTests
      browser:
        description: 'Browserul'
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - edge

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # MySQL e deja instalat pe masina GitHub, cu root / root
      # (un service cu imaginea mysql din Docker Hub pica uneori din cauza limitei de descarcari)
      - name: Start MySQL and create database
        run: |
          sudo systemctl start mysql
          mysql -u root -proot < src/test/resources/createTables.sql

      - name: Run tests
        env:
          DB_PASSWORD: root
        run: mvn clean test -DCICD=true -Dbrowser=${{ github.event.inputs.browser }} -Dsuite=suites/${{ github.event.inputs.suite }}.xml

      # raportul si logurile se pot descarca din pagina rularii, chiar daca au picat teste
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            target/chaintest
            target/logs
